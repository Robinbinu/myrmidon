# Tier 4 (docs/verification.md): periodic model evaluations with real models, which spend real money. Opt-in twice
# over: it never runs on a push or a pull request; a manual run must tick `spend`; the weekly run happens only when
# the repository variable MODEL_EVAL_SCHEDULE is `on`; and either way it stops before the server starts unless the
# provider's key is a repository secret. It runs the eval harness's own entry point (`bun run eval`, apps/eval) against a
# scratch server and keeps the report with the model and config it ran. Comparing a run with a baseline is phase 2.
name: Model eval

on:
  workflow_dispatch:
    inputs:
      spend:
        description: I understand this calls real models and spends money on the provider's key
        type: boolean
        default: false
      provider:
        description: Provider whose key (a repository secret of the same name) the server gets
        type: choice
        default: ANTHROPIC_API_KEY
        options:
          [ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, DEEPSEEK_API_KEY]
      model:
        description: Model to run, provider/id (empty uses the server's default for that key)
        type: string
        default: ''
      judge:
        description: Judge model, provider/id (empty uses the model)
        type: string
        default: ''
      cases:
        description: Case ids, comma-separated (empty runs every case)
        type: string
        default: ''
      modes:
        description: Team modes, comma-separated
        type: string
        default: orchestrated,swarm
      trials:
        description: Trials per case and mode
        type: string
        default: '1'
  schedule:
    # Mondays 07:00 UTC, after the omp bump; a no-op unless vars.MODEL_EVAL_SCHEDULE is `on`.
    - cron: '0 7 * * 1'

concurrency:
  group: model-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.spend) ||
      (github.event_name == 'schedule' && vars.MODEL_EVAL_SCHEDULE == 'on') }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      PROVIDER_ENV: ${{ inputs.provider || vars.MODEL_EVAL_PROVIDER || 'ANTHROPIC_API_KEY' }}
      MODEL: ${{ inputs.model || vars.MODEL_EVAL_MODEL || '' }}
      JUDGE: ${{ inputs.judge || vars.MODEL_EVAL_JUDGE || '' }}
      CASES: ${{ inputs.cases || '' }}
      MODES: ${{ inputs.modes || 'orchestrated,swarm' }}
      TRIALS: ${{ inputs.trials || '1' }}
      PORT: '4391'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The key goes to the server's environment only; a missing one stops the run before anything is spent.
      - name: Start a scratch server with the provider's key
        env:
          KEY: ${{ secrets[inputs.provider || vars.MODEL_EVAL_PROVIDER || 'ANTHROPIC_API_KEY'] }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::no repository secret $PROVIDER_ENV: nothing was run"
            exit 1
          fi
          home="$RUNNER_TEMP/myr-eval-home"
          mkdir -p "$home"
          echo "MYR_EVAL_HOME=$home" >> "$GITHUB_ENV"
          env -u KEY "$PROVIDER_ENV=$KEY" bun apps/cli/src/main.ts serve --home "$home" --port "$PORT" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 120); do
            [ -f "$home/server.json" ] && curl -sf -o /dev/null -H "authorization: Bearer $(jq -r .token "$home/server.json")" "http://127.0.0.1:$PORT/api/whoami" && exit 0
            sleep 1
          done
          echo "::error::the server did not start"
          tail -50 "$RUNNER_TEMP/server.log"
          exit 1

      - name: Run the eval harness
        run: |
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          out="evals/results/$stamp.json"
          echo "EVAL_OUT=$out" >> "$GITHUB_ENV"
          args=(--base "http://127.0.0.1:$PORT" --modes "$MODES" --trials "$TRIALS" --out "$out")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          [ -n "$JUDGE" ] && args+=(--judge "$JUDGE")
          [ -n "$CASES" ] && args+=(--cases "$CASES")
          MYR_TOKEN=$(jq -r .token "$MYR_EVAL_HOME/server.json") bun run eval "${args[@]}"

      # What the run was, beside what it found: the harness's report names the model and judge; this adds the rest.
      - name: Record the run's configuration
        if: ${{ always() && env.EVAL_OUT }}
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg event "$GITHUB_EVENT_NAME" \
            --arg provider "$PROVIDER_ENV" --arg model "$MODEL" --arg judge "$JUDGE" --arg cases "$CASES" \
            --arg modes "$MODES" --arg trials "$TRIALS" --arg runner "$RUNNER_OS-$RUNNER_ARCH" \
            '{commit:$commit, ref:$ref, event:$event, provider:$provider, model:$model, judge:$judge, cases:$cases,
              modes:$modes, trials:$trials, runner:$runner}' > "${EVAL_OUT%.json}.run.json"

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ github.run_id }}
          path: |
            evals/results/
            ${{ runner.temp }}/server.log
          if-no-files-found: warn
          retention-days: 90

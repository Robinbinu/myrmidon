# Proves Myrmidon builds and passes its suite on macOS; Linux and Windows run by hand until they are supported. On
# develop, main and pull requests to main it then builds the macOS app and smoke-tests the package (docs/ci.md,
# docs/verification.md). No job uses a secret or spends money on a model.
name: CI

on:
  push:
    branches: [develop, main, 'xp-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      os:
        description: Which OS to run (all runs the whole matrix)
        type: choice
        default: macos-latest
        options: [all, macos-latest, ubuntu-latest, windows-latest]
      tests:
        description: Only test files whose path contains one of these words (space-separated); empty runs all
        type: string
        default: ''
      pending:
        description: Also run the tests pending on this OS (tests/platform.ts), to see whether a fix closes their gap
        type: boolean
        default: false
      bun:
        description: Bun version to run with, to try a newer one (the repository's floor by default)
        type: string
        default: 1.3.14
      smoke:
        description: Also build the macOS app and smoke-test the package (scripts/smoke-desktop.ts)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.os || 'all' }}-${{ inputs.bun || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run macOS only: Linux and Windows are not supported yet (their GitHub issues track
        # the gaps), so a manual run picks them. inputs.os is a fixed choice, so it is safe to splice in.
        os: ${{ fromJSON(inputs.os == 'all' && '["macos-latest","ubuntu-latest","windows-latest"]' || inputs.os && format('["{0}"]', inputs.os) || '["macos-latest"]') }}
    steps:
      # Windows checks out CRLF by default, which breaks Biome's formatter check and byte-exact fixtures.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun || '1.3.14' }}

      # Restore and save are split so a failing test run still keeps the cache for the next one.
      - name: Restore Bun packages and the Electrobun toolchain
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - run: bun install --frozen-lockfile

      - if: ${{ !cancelled() }}
        run: bun run desktop:typecheck

      - name: Save Bun packages and the Electrobun toolchain
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}

      - if: ${{ !cancelled() }}
        run: bun run typecheck

      - if: ${{ !cancelled() }}
        run: bun run lint

      # The command sandbox on Linux is bubblewrap; Ubuntu 24.04's AppArmor blocks the unprivileged user
      # namespaces it (and Chrome's own sandbox) needs.
      - name: Install bubblewrap and allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          MYR_RUN_PENDING: ${{ inputs.pending && '1' || '' }}
        # TESTS is deliberately unquoted: it is a list of path filters. A run still going after 25 minutes is stuck
        # (a whole run takes about 12): it is stopped, saying what was running, instead of holding the job to 45.
        run: |
          bun test --timeout 30000 $TESTS &
          tests=$!
          (
            for _ in $(seq 150); do
              sleep 10
              kill -0 $tests 2>/dev/null || exit 0
            done
            echo "::error::the tests were still running after 25 minutes; what was running:"
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 400"
            else
              ps -Ao pid,ppid,etime,command
            fi
            kill $tests
          ) &
          code=0
          wait $tests || code=$?
          exit $code

  # Tier 3 (docs/verification.md): the release build, unpacked and launched with an empty HOME, its server, its leash
  # and its signatures checked. After the suite, so a red suite does not also spend macOS minutes on a build.
  smoke-desktop:
    name: macOS app smoke test
    needs: check
    if: >-
      ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.smoke) }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun || '1.3.14' }}

      - name: Restore Bun packages and the Electrobun toolchain
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - run: bun install --frozen-lockfile

      # Builds the release (sidecar, then electrobun build --env=stable, signed ad hoc: no Developer ID, no
      # notarization), then runs the checks; it prints the server's log when the app's server does not start.
      - name: Build and smoke-test the macOS app
        run: bun run smoke:desktop

# Proves Myrmidon builds and passes its suite on macOS, Linux and Windows. See docs/ci.md.
name: CI

on:
  push:
    branches: [develop, 'xp-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      os:
        description: Which OS to run (all runs the whole matrix)
        type: choice
        default: all
        options: [all, macos-latest, ubuntu-latest, windows-latest]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A manual run can pick one OS; inputs.os is a fixed choice, so it is safe to splice in.
        os: ${{ fromJSON(inputs.os && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    steps:
      # Windows checks out CRLF by default, which breaks Biome's formatter check and byte-exact fixtures.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages and the Electrobun toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - run: bun install --frozen-lockfile

      - if: ${{ !cancelled() }}
        run: bun run typecheck

      - if: ${{ !cancelled() }}
        run: bun run desktop:typecheck

      - if: ${{ !cancelled() }}
        run: bun run lint

      # The command sandbox on Linux is bubblewrap; Ubuntu 24.04's AppArmor blocks the unprivileged user
      # namespaces it (and Chrome's own sandbox) needs.
      - name: Install bubblewrap and allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        if: ${{ !cancelled() }}
        run: bun test --timeout 30000

# Proves Myrmidon builds and passes its suite on macOS, Linux and Windows. See docs/ci.md.
name: CI

on:
  push:
    branches: [develop, 'xp-*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      os:
        description: Which OS to run (all runs the whole matrix)
        type: choice
        default: all
        options: [all, macos-latest, ubuntu-latest, windows-latest]
      tests:
        description: Only test files whose path contains one of these words (space-separated); empty runs all
        type: string
        default: ''
      pending:
        description: Also run the tests pending on this OS (tests/platform.ts), to see whether a fix closes their gap
        type: boolean
        default: false
      bun:
        description: Bun version to run with, to try a newer one (the repository's floor by default)
        type: string
        default: 1.3.14

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.os || 'all' }}-${{ inputs.bun || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # A manual run can pick one OS; inputs.os is a fixed choice, so it is safe to splice in.
        os: ${{ fromJSON(inputs.os && inputs.os != 'all' && format('["{0}"]', inputs.os) || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    steps:
      # Windows checks out CRLF by default, which breaks Biome's formatter check and byte-exact fixtures.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun || '1.3.14' }}

      # Restore and save are split so a failing test run still keeps the cache for the next one.
      - name: Restore Bun packages and the Electrobun toolchain
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-

      - run: bun install --frozen-lockfile

      - if: ${{ !cancelled() }}
        run: bun run desktop:typecheck

      - name: Save Bun packages and the Electrobun toolchain
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.hutch/npm
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}

      - if: ${{ !cancelled() }}
        run: bun run typecheck

      - if: ${{ !cancelled() }}
        run: bun run lint

      # The command sandbox on Linux is bubblewrap; Ubuntu 24.04's AppArmor blocks the unprivileged user
      # namespaces it (and Chrome's own sandbox) needs.
      - name: Install bubblewrap and allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        if: ${{ !cancelled() }}
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
          MYR_RUN_PENDING: ${{ inputs.pending && '1' || '' }}
        # TESTS is deliberately unquoted: it is a list of path filters.
        run: bun test --timeout 30000 $TESTS
